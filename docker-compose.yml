name: safe-accounts

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safe_accounts}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"
    stop_grace_period: 1s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-safe_accounts}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Мастер-ключ: через env или файл (см. secrets/ и entrypoint).
      VAULT_MASTER_KEY_BASE64: ${VAULT_MASTER_KEY_BASE64:-}
      VAULT_MASTER_KEY_FILE: ${VAULT_MASTER_KEY_FILE:-}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      # Task-09: наблюдаемость и защита поверхности.
      # Rate limiting по IP для login/register (in-memory, на инстанс).
      APP_RATE_LIMIT_WINDOW_SECONDS: ${APP_RATE_LIMIT_WINDOW_SECONDS:-60}
      APP_RATE_LIMIT_MAX_REQUESTS: ${APP_RATE_LIMIT_MAX_REQUESTS:-10}
      # HSTS — включать только за TLS-терминацией.
      APP_HSTS_ENABLED: ${APP_HSTS_ENABLED:-false}
      # Swagger/OpenAPI в docker-профиле закрыт (Task-09).
      APP_API_DOCS_ENABLED: ${APP_API_DOCS_ENABLED:-false}
      APP_DEV_PROFILE: ${APP_DEV_PROFILE:-false}
    ports:
      # Хост-порт настраивается через APP_PORT (.env), внутренний порт контейнера — 8080.
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      # wget присутствует в alpine-образе (busybox).
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
