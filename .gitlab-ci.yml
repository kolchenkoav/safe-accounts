#================================================================================================
# .gitlab-ci.yml — CI/CD для safe-accounts: тесты, сборка, Docker-образ, деплой на Synology NAS.
#================================================================================================

stages:
  - test
  - build
  - docker
  - deploy
  - cleanup

variables:
  # Общий Maven-кэш (папка .m2 внутри проекта) — см. cache ниже.
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

default:
  tags:
    - docker

cache:
  key: maven-cache-jdk21
  paths:
    - .m2/repository

# ---------------------------------------------------------------------------
# Стадия test — unit-тесты (surefire) и интеграционные тесты
# на Testcontainers (failsafe) через mvn verify.
# ---------------------------------------------------------------------------
test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  # Используем Docker daemon хоста (раннер пробрасывает /var/run/docker.sock) — dind на
  # Synology нестабилен; при возврате на общие раннеры gitlab.com вернуть сервис
  # docker:24.0.7-dind + DOCKER_HOST=tcp://docker:2375.
  script:
    # verify запускает surefire (unit) и failsafe (интеграционные) отчёты.
    - mvn -B verify
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
  rules:
    # Выполняем тесты и для веток, и для тегов: иначе needs-цепочка деплоя по
    # тегу развалится (build/docker/deploy получат skipped без артефактов build).
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# Стадия build — собираем исполняемый jar; тесты уже прошли на стадии test.
# ---------------------------------------------------------------------------
build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  needs:
    - test
  script:
    - mvn -B package -DskipTests
  artifacts:
    paths:
      - target/safe-accounts.jar
  rules:
    # Теги и ветки равнозначны (см. комментарий у джобы test).
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# Стадия docker — сборка linux/amd64 и публикация в registry GitLab.
# Версия: тег (CI_COMMIT_TAG) либо 1.0.<номер пайплайна>.
# ---------------------------------------------------------------------------
docker:
  stage: docker
  image: docker:24.0.7
  # Используем Docker daemon хоста (раннер пробрасывает /var/run/docker.sock) — dind на
  # Synology нестабилен; при возврате на общие раннеры gitlab.com вернуть сервис
  # docker:24.0.7-dind + DOCKER_HOST=tcp://docker:2375.
  needs:
    - build
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION=$CI_COMMIT_TAG
      else
        VERSION=1.0.$CI_PIPELINE_IID
      fi
    - echo "VERSION=$VERSION" > version.env
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --platform linux/amd64 -t "$CI_REGISTRY_IMAGE:$VERSION" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  artifacts:
    reports:
      dotenv: version.env
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

deploy:
  stage: deploy
  image: docker:24.0.7
  needs:
    - docker
  environment: synology
  script:
    - |
      if [ -z "$NAS_SSH_HOST" ]; then echo "ERROR: NAS_SSH_HOST is not set (add GitLab CI/CD variable)" >&2; exit 1; fi
      if [ -z "$NAS_SSH_USER" ]; then echo "ERROR: NAS_SSH_USER is not set (add GitLab CI/CD variable)" >&2; exit 1; fi
      if [ -z "$NAS_SSH_PRIVATE_KEY" ]; then echo "ERROR: NAS_SSH_PRIVATE_KEY is not set (set as File variable)" >&2; exit 1; fi
      if [ ! -f "$NAS_SSH_PRIVATE_KEY" ]; then echo "ERROR: NAS_SSH_PRIVATE_KEY file not found (set as File variable)" >&2; exit 1; fi
      if [ -z "$NAS_REGISTRY_USER" ]; then echo "ERROR: NAS_REGISTRY_USER is not set (add GitLab CI/CD variable)" >&2; exit 1; fi
      if [ -z "$NAS_REGISTRY_TOKEN" ]; then echo "ERROR: NAS_REGISTRY_TOKEN is not set (add GitLab CI/CD variable)" >&2; exit 1; fi

    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    # Копируем ключ, удаляем Windows-переносы (\r) и гарантируем пустую строку в конце
    - tr -d '\r' < "$NAS_SSH_PRIVATE_KEY" > ~/.ssh/ci_cd_key
    - '[ -n "$(tail -c1 ~/.ssh/ci_cd_key)" ] && echo "" >> ~/.ssh/ci_cd_key || true'
    - chmod 600 ~/.ssh/ci_cd_key

    - ssh-keyscan -H "$NAS_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

    - |
      tar -cf - docker-compose.yml docker-compose.synology.yml docker-compose.deploy.yml | \
      ssh -i ~/.ssh/ci_cd_key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
        "$NAS_SSH_USER@$NAS_SSH_HOST" \
        "mkdir -p /volume1/docker/safe-accounts && ls -ld /volume1/docker/safe-accounts && tar -xf - -C /volume1/docker/safe-accounts/"

    - |
      ssh -i ~/.ssh/ci_cd_key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes "$NAS_SSH_USER@$NAS_SSH_HOST" \
        "export PATH=/var/packages/ContainerManager/target/usr/bin:/var/packages/ContainerManager/target/usr/lib/docker/cli-plugins:/var/packages/ContainerManager/target/usr/libexec/docker/cli-plugins:/var/packages/Docker/target/usr/bin:/usr/local/bin:\$PATH; \
         cd /volume1/docker/safe-accounts && set -e && \
         docker info >/dev/null && \
         docker compose version && \
         echo \"$NAS_REGISTRY_TOKEN\" | docker login -u \"$NAS_REGISTRY_USER\" --password-stdin \"$CI_REGISTRY\" && \
         SAFE_ACCOUNTS_IMAGE=\"$CI_REGISTRY_IMAGE:$VERSION\" docker compose -f docker-compose.yml -f docker-compose.synology.yml -f docker-compose.deploy.yml down --remove-orphans --timeout 30 && \
         SAFE_ACCOUNTS_IMAGE=\"$CI_REGISTRY_IMAGE:$VERSION\" docker compose -f docker-compose.yml -f docker-compose.synology.yml -f docker-compose.deploy.yml pull app && \
         SAFE_ACCOUNTS_IMAGE=\"$CI_REGISTRY_IMAGE:$VERSION\" docker compose -f docker-compose.yml -f docker-compose.synology.yml -f docker-compose.deploy.yml up -d"
    - |
      ssh -i ~/.ssh/ci_cd_key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes "$NAS_SSH_USER@$NAS_SSH_HOST" \
        "export PATH=/var/packages/ContainerManager/target/usr/bin:/var/packages/ContainerManager/target/usr/lib/docker/cli-plugins:/var/packages/ContainerManager/target/usr/libexec/docker/cli-plugins:/var/packages/Docker/target/usr/bin:/usr/local/bin:\$PATH; docker logout \"$CI_REGISTRY\" || true"
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# Стадия cleanup — удаляем на NAS старые образы: остаются 3 последние версии
# и latest. Портируемая реализация для busybox/alpine: без head -n -N.
# latest исключается фильтром; используемые контейнерами образы docker rmi
# не удаляет; ошибки гасит финальный "|| true".
# ---------------------------------------------------------------------------
cleanup:
  stage: cleanup
  image: docker:24.0.7
  needs:
    - deploy
  when: on_success
  script:
    - |
      if [ -z "$NAS_SSH_HOST" ]; then echo "ERROR: NAS_SSH_HOST is not set (add GitLab CI/CD variable)" >&2; exit 1; fi
      if [ -z "$NAS_SSH_USER" ]; then echo "ERROR: NAS_SSH_USER is not set (add GitLab CI/CD variable)" >&2; exit 1; fi
      if [ -z "$NAS_SSH_PRIVATE_KEY" ]; then echo "ERROR: NAS_SSH_PRIVATE_KEY is not set (set as File variable)" >&2; exit 1; fi
      if [ ! -f "$NAS_SSH_PRIVATE_KEY" ]; then echo "ERROR: NAS_SSH_PRIVATE_KEY file not found (set as File variable)" >&2; exit 1; fi

    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    # Копируем ключ, удаляем Windows-переносы (\r) и гарантируем пустую строку в конце
    - tr -d '\r' < "$NAS_SSH_PRIVATE_KEY" > ~/.ssh/ci_cd_key
    - '[ -n "$(tail -c1 ~/.ssh/ci_cd_key)" ] && echo "" >> ~/.ssh/ci_cd_key || true'
    - chmod 600 ~/.ssh/ci_cd_key

    - ssh-keyscan -H "$NAS_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

    - |
      ssh -i ~/.ssh/ci_cd_key -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes "$NAS_SSH_USER@$NAS_SSH_HOST" \
        "set -e && docker images --format '{{.Repository}}:{{.Tag}}' | \
         awk -F: -v p=\"$CI_REGISTRY_IMAGE\" '\$1 == p && \$2 !~ /^latest$/ { split(\$2, t, /\\./); print t[length(t)] + 0, \$0 }' | \
         sort -nr -k1,1 | awk 'NR > 3 { s = \$2; for (i = 3; i <= NF; i++) s = s OFS \$i; print s }' | \
         xargs -r docker rmi -f || true"
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG