# Override для Synology NAS: автозапуск БД после ребута NAS.
# Порт БД на хосте не публикуется: в базовом docker-compose.yml секции ports у db нет
# (на NAS 5432 занят PostgreSQL другого приложения). Вариант с `!override []` здесь
# не работает: Compose в Container Manager (DSM) старше 2.24 молча игнорирует тег.
# Ручной доступ к БД на NAS: docker exec -it safe-accounts-db-1 psql -U <user> <db>
services:
  db:
    restart: unless-stopped
