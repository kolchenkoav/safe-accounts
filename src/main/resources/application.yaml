spring:
  application:
    name: safe-accounts
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:safe_accounts}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # Task-07/08: multipart для импорта CSV. Лимит Spring multipart намеренно
  # ВЫШЕ сервисного лимита MAX_CSV_BYTES (10 МБ), чтобы сервисный
  # VaultExportImportService.importFromCsv первым бросал PayloadTooLargeException
  # → 413 RFC 7807 (а не MaxUploadSizeExceededException от Tomcat).
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 12MB
      # TP B1: ленивый резолв — multipart парсится при резолве аргументов
      # контроллера, а не в DispatcherServlet.checkMultipart ДО getHandler.
      # Тогда обработчик уже смаплен и package-scoped advice достижим:
      # MaxUploadSizeExceededException ловится ApiExceptionHandler → 413
      # (раньше REST /api/vault/import >11MB отдавал 500). Фильтров,
      # зависящих от раннего multipart-парсинга, в проекте нет (безопасно).
      # Web-цепочка >11MB: фактический исход — 302 (advice при падении
      # в Spring-резолвере; см. OversizeUploadIT, допускает 302|413).
      # Tomcat error-page (ErrorPageConfig → /web/error/file-too-large) —
      # страховка для случая, когда Spring-тип MaxUploadSizeExceededException
      # не перехвачен advice; нативные исключения Tomcat из фильтров этим
      # error-page не покрываются.
      resolve-lazily: true

server:
  port: ${SERVER_PORT:8080}
  error:
    # RFC 7807 ProblemDetail, без стектрейсов клиенту
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        # Task-09: наружу только health, info и prometheus (метрики).
        include: health,info,prometheus
  endpoint:
    health:
      # Health не раскрывает чувствительные детали (Task-09)
      show-details: never
      probes:
        # readiness/liveness probes для контейнеров (Task-09)
        enabled: true
  health:
    db:
      enabled: true
  # Prometheus-метрики: только агрегаты (счетчики/гистограммы), без секретов
  prometheus:
    metrics:
      export:
        enabled: true

# Мастер-ключ (KEK): материал ключа читается ТОЛЬКО из переменных окружения
# или файла секрета. Значения по умолчанию отсутствуют намеренно:
# без ключа приложение обязано падать на старте (см. AGENTS.md).
vault:
  master-key:
    base64: ${VAULT_MASTER_KEY_BASE64:}
    file: ${VAULT_MASTER_KEY_FILE:}

# Криптомодуль (Task-03). Оба режима задаются через окружение:
#  - упрощенный: одиночный KEK из APP_CRYPTO_MASTER_KEY_BASE64 / APP_CRYPTO_MASTER_KEY_FILE;
#  - расширенный (ротация): список KEK через переменные APP_CRYPTO_KEYS_0_ID,
#    APP_CRYPTO_KEYS_0_SECRET_BASE64, APP_CRYPTO_KEYS_0_ACTIVE (индексы 0,1,2...).
#    Spring Boot relaxed binding привязывает app.crypto.keys[n].* к CryptoProperties
#    напрямую из окружения, поэтому секция keys в yaml не объявлена намеренно:
#    материал ключей не должен появляться в конфигурационных файлах.
# Значения по умолчанию отсутствуют намеренно: KeyManager обязан падать на старте,
# если ни одного ключа не задано (кроме тестовых профилей).
app:
  crypto:
    # Упрощенный режим: поддерживаются и новые, и прежние (Task-01) имена переменных.
    master-key-base64: ${APP_CRYPTO_MASTER_KEY_BASE64:${VAULT_MASTER_KEY_BASE64:}}
    master-key-file: ${APP_CRYPTO_MASTER_KEY_FILE:${VAULT_MASTER_KEY_FILE:}}
  security:
    # Task-09: dev-профиль включает Swagger. В проде — только через env.
    dev-profile: ${APP_DEV_PROFILE:false}
    # Strict-Transport-Security (Task-09): включать, когда приложение работает
    # за TLS-терминацией.
    hsts-enabled: ${APP_HSTS_ENABLED:false}
# Task-09: базовый in-memory rate limiting по IP для login/register.
  # При горизонтальном масштабировании требуется распределенный лимитер (Redis).
  rate-limit:
    window-seconds: ${APP_RATE_LIMIT_WINDOW_SECONDS:60}
    max-requests: ${APP_RATE_LIMIT_MAX_REQUESTS:10}
  # Фаза 6: rate-limit на импорт (POST /api/vault/import и
  # POST /api/admin/users/{id}/vault/import). Отдельный bucket: тот же IP
  # может спокойно логиниться, но не выгружать в сейф по 60 CSV в минуту.
  # При горизонтальном масштабировании — тоже Redis.
  vault:
    import:
      rate-limit:
        window-seconds: ${APP_VAULT_IMPORT_RATE_LIMIT_WINDOW_SECONDS:60}
        max-requests: ${APP_VAULT_IMPORT_RATE_LIMIT_MAX_REQUESTS:3}

springdoc:
  api-docs:
    path: /api-docs
    # Task-09: документация API включена только в dev-профиле
    # (в application-dev.yaml). В prod/docker Swagger закрыт.
    enabled: ${APP_API_DOCS_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${APP_API_DOCS_ENABLED:false}

logging:
  level:
    root: INFO
    # Никогда не поднимать до DEBUG/TRACE: в этих логгерах могут оказаться секреты
    org.springframework.security: INFO
