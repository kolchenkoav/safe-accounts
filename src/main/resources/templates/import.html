<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru" data-theme="dark">
<!-- Каркас <head> (включая theme.js/main.js) — общий фрагмент -->
<head th:replace="~{fragments :: pageHead('Импорт CSV — safe-accounts')}"></head>
<body>
<nav>
    <a th:href="@{/web/entries}">&larr; К записям</a>
    <!-- Тема: тёмная/светлая, выбор в localStorage (тёмная по умолчанию) -->
    <button type="button" th:replace="~{fragments :: themeToggle}"></button>
</nav>

<main class="card">
    <h1>Импорт CSV</h1>

    <div class="alert alert-info" th:if="${flashMessage}" th:text="${flashMessage}"></div>
    <div class="alert alert-error" th:if="${flashError}" th:text="${flashError}"></div>

    <!-- Предупреждение о plaintext-паролях и поведении upsert (план 2.5) -->
    <div class="alert alert-warning">
        CSV содержит пароли в открытом виде; при upsert существующие записи
        будут перезаписаны.
    </div>

    <!-- multipart-форма; Tomcat буферизует части во временные файлы work-директории
         (авто-очистка после запроса); в БД/логи/модель файл не попадает.
         Формат: name,url,username,password,note (RFC 4180, UTF-8). -->
    <form th:action="@{/web/entries/import}" method="post" enctype="multipart/form-data">
        <label for="file">CSV-файл</label>
        <input type="file" id="file" name="file" accept=".csv" required />

        <label for="conflictStrategy">Конфликты (дубли: сайт + логин)</label>
        <select id="conflictStrategy" name="conflictStrategy">
            <option value="skip" selected>пропускать дубли</option>
            <option value="upsert">обновлять дубли</option>
        </select>

        <label class="checkbox">
            <input type="checkbox" name="dryRun" value="true" />
            только проверить, без изменений
        </label>

        <label class="checkbox">
            <input type="checkbox" name="failFast" value="true" />
            остановить при первой ошибке
        </label>

        <button type="submit">Импортировать</button>
    </form>

    <p><a th:href="@{/web/entries}">К записям</a></p>
</main>
</body>
</html>
