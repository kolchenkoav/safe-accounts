<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru" data-theme="dark">
    <!-- Каркас <head> (включая theme.js без defer, анти-FOUC) — общий фрагмент -->
<head th:replace="~{fragments :: pageHead('Пользователи — safe-accounts')}"></head>
    <body>
        <!-- Общая навигация админки (включая переключатель темы) — фрагмент -->
        <nav th:replace="~{fragments :: adminNav(${username})}"></nav>

        <main class="card wide">
            <h1>Пользователи</h1>

            <div
                class="alert alert-info"
                th:if="${flashMessage}"
                th:text="${flashMessage}"
            ></div>
            <div
                class="alert alert-error"
                th:if="${flashError}"
                th:text="${flashError}"
            ></div>

            <h2>Создать пользователя</h2>
            <form
                th:action="@{/web/admin/users}"
                method="post"
                autocomplete="off"
                class="create-user"
            >
                <!-- Пароль только в теле POST; в шаблон не подставляется и не логируется -->
                <label for="new-username">Имя пользователя</label>
                <input
                    type="text"
                    id="new-username"
                    name="username"
                    required
                    maxlength="64"
                    pattern="[a-z0-9._\-]{3,64}"
                />
                <label for="new-password">Пароль</label>
                <input
                    type="password"
                    id="new-password"
                    name="password"
                    required
                    minlength="12"
                    maxlength="128"
                    autocomplete="new-password"
                />
                <label for="new-role">Роль</label>
                <select id="new-role" name="role">
                    <option value="ROLE_USER">ROLE_USER</option>
                    <option value="ROLE_ADMIN">ROLE_ADMIN</option>
                </select>
                <button type="submit">Создать</button>
            </form>

            <table th:if="${!users.isEmpty()}">
                <thead>
                    <tr>
                        <th>Имя</th>
                        <th>Роль</th>
                        <th>Статус</th>
                        <th>Создан</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Хэши паролей и wrapped DEK никогда не попадают в модель -->
                    <tr th:each="u : ${users}">
                        <td th:text="${u.username}"></td>
                        <td th:text="${u.role}"></td>
                        <td th:text="${u.enabled ? 'Активен' : 'Отключен'}"></td>
                        <td
                            th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')}"
                        ></td>
                        <td>
                            <form
                                class="inline"
                                th:if="${u.enabled}"
                                th:action="@{/web/admin/users/{id}/disable(id=${u.id})}"
                                method="post"
                            >
                                <button type="submit" class="danger small">
                                    Отключить
                                </button>
                            </form>
                            <form
                                class="inline"
                                th:if="${!u.enabled}"
                                th:action="@{/web/admin/users/{id}/enable(id=${u.id})}"
                                method="post"
                            >
                                <button type="submit" class="small">Включить</button>
                            </form>
                            <form
                                class="inline"
                                th:action="@{/web/admin/users/{id}/change-role(id=${u.id})}"
                                method="post"
                            >
                                <select name="role" aria-label="Новая роль">
                                    <option value="ROLE_USER">ROLE_USER</option>
                                    <option value="ROLE_ADMIN">ROLE_ADMIN</option>
                                </select>
                                <button type="submit" class="small">Сменить роль</button>
                            </form>
                            <form
                                class="inline"
                                th:action="@{/web/admin/users/{id}/reset-password(id=${u.id})}"
                                method="post"
                            >
                                <input
                                    type="password"
                                    name="newPassword"
                                    required
                                    minlength="12"
                                    maxlength="128"
                                    placeholder="Новый пароль"
                                    autocomplete="new-password"
                                    aria-label="Новый пароль"
                                />
                                <button type="submit" class="danger small">
                                    Сбросить пароль
                                </button>
                            </form>
                            <!-- CSV-действия (Фаза 4): компактно, без разъезда вёрстки -->
                            <form
                                class="inline"
                                th:action="@{/web/admin/users/{id}/vault/export(id=${u.id})}"
                                method="get"
                                data-confirm="CSV будет содержать пароли в открытом виде. Продолжить?"
                            >
                                <label class="checkbox compact"
                                    ><input type="checkbox" name="bom" value="true" /> BOM</label
                                >
                                <button type="submit" class="small">Экспорт CSV</button>
                            </form>
                            <a
                                class="small-link"
                                th:href="@{/web/admin/users/{id}/vault/import(id=${u.id})}"
                                >Импорт CSV</a
                            >
                        </td>
                    </tr>
                </tbody>
            </table>
            <p th:if="${users.isEmpty()}">Пользователей нет.</p>

            <div class="pagination" th:if="${totalPages > 1}">
                <a
                    th:if="${currentPage > 0}"
                    th:href="@{/web/admin/users(page=${currentPage - 1})}"
                    >&larr;</a
                >
                <span
                    th:text="${currentPage + 1} + ' / ' + ${totalPages}"
                ></span>
                <a
                    th:if="${currentPage + 1 < totalPages}"
                    th:href="@{/web/admin/users(page=${currentPage + 1})}"
                    >&rarr;</a
                >
            </div>
        </main>
    </body>
</html>
