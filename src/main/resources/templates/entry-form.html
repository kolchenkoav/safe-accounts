<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru" data-theme="dark">
<!-- Каркас <head> (включая theme.js без defer, анти-FOUC) — общий фрагмент -->
<head th:replace="~{fragments :: pageHead('Новая запись — safe-accounts')}"></head>
<body>
<nav>
    <a th:href="@{/web/entries}">&larr; К списку</a>
    <!-- Тема: тёмная/светлая, выбор в localStorage (тёмная по умолчанию) -->
    <button type="button" th:replace="~{fragments :: themeToggle}"></button>
</nav>

<main class="card">
    <h1>Новая запись</h1>

    <!-- Пароль передается только в теле POST-запроса; в логи и шаблоны не попадает. -->
    <form th:action="@{/web/entries}" th:object="${entryForm}" method="post">
        <!-- Сводная ошибка валидации: все поля формы, включая name -->
        <div class="alert alert-error" th:if="${#fields.hasAnyErrors()}" th:errors="*{*}"></div>

        <label for="name">Название</label>
        <input type="text" id="name" th:field="*{name}" required maxlength="256" autocomplete="off">

        <label for="site">Сайт</label>
        <input type="text" id="site" th:field="*{site}" required maxlength="2048">

        <label for="login">Логин</label>
        <input type="text" id="login" th:field="*{login}" required maxlength="2048">

        <label for="password">Пароль</label>
        <input type="password" id="password" th:field="*{password}" required maxlength="4096">

        <label for="notes">Примечание</label>
        <textarea id="notes" th:field="*{notes}" maxlength="8192" rows="4"></textarea>

        <button type="submit">Создать</button>
    </form>
</main>
</body>
</html>
