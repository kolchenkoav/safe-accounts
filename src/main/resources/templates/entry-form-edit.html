<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru" data-theme="dark">
<!-- Каркас <head> (включая theme.js без defer, анти-FOUC) — общий фрагмент -->
<head th:replace="~{fragments :: pageHead('Изменение записи — safe-accounts')}"></head>
<body>
<nav>
    <a th:href="@{/web/entries}">&larr; К списку</a>
    <a th:href="@{/web/entries/{id}(id=${entryId})}">К записи</a>
    <!-- Тема: тёмная/светлая, выбор в localStorage (тёмная по умолчанию) -->
    <button type="button" th:replace="~{fragments :: themeToggle}"></button>
</nav>

<main class="card">
    <h1>Изменение записи</h1>

    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <!-- Старый пароль в HTML не выносим (безопасность Task-11): поле пустое,
         пароль нужно ввести заново. -->
    <form th:action="@{/web/entries/{id}/edit(id=${entryId})}" th:object="${entryForm}" method="post">
        <!-- Сводная ошибка валидации: все поля формы, включая name -->
        <div class="alert alert-error" th:if="${#fields.hasAnyErrors()}" th:errors="*{*}"></div>

        <label for="name">Название</label>
        <input type="text" id="name" th:field="*{name}" required maxlength="256" autocomplete="off">

        <label for="site">Сайт</label>
        <input type="text" id="site" th:field="*{site}" required maxlength="2048">

        <label for="login">Логин</label>
        <input type="text" id="login" th:field="*{login}" required maxlength="2048">

        <label for="password">Пароль (введите заново)</label>
        <!-- input-group: поле + глаз + генератор (Фаза 1 password-generator-copy).
             Генерация перезаписывает поле «введите заново» — это ок: старый пароль
             в HTML не выносится (безопасность Task-11). -->
        <div class="input-group">
            <input type="password" id="password" th:field="*{password}" required maxlength="4096"
                   data-password-field autocomplete="new-password">
            <button type="button" class="small" data-toggle-password>Показать</button>
            <button type="button" class="small" data-generate-password>Сгенерировать</button>
        </div>
        <!-- Опции генератора: всегда видимы; серверная валидация (@Size) — страховка -->
        <div class="password-options">
            <label>Длина <input type="number" data-pw-length min="12" max="64" value="20"></label>
            <label><input type="checkbox" data-pw-symbols checked> Спецсимволы</label>
            <label><input type="checkbox" data-pw-avoid-ambiguous checked> Без неоднозначных (0 O 1 l I)</label>
            <span class="muted">Сгенерированный пароль показан открыто — проверьте и сохраните</span>
        </div>

        <label for="notes">Примечание</label>
        <textarea id="notes" th:field="*{notes}" maxlength="8192" rows="4"></textarea>

        <button type="submit">Сохранить</button>
    </form>
</main>
</body>
</html>
