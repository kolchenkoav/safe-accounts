<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru" data-theme="dark">
    <!-- Каркас <head> (включая theme.js без defer, анти-FOUC) — общий фрагмент -->
<head th:replace="~{fragments :: pageHead('Записи — safe-accounts')}"></head>
    <body>
        <nav>
            <span class="user" th:text="${username}">user</span>
            <span>
                <!-- «Теги» — всем аутентифицированным (Фаза 2) -->
                <a th:href="@{/web/tags}">Теги</a>
                <!-- Ссылка «Админка» — только ROLE_ADMIN (Task-12) -->
                <a th:if="${isAdmin}" th:href="@{/web/admin/users}">Админка</a>
                <form th:action="@{/logout}" method="post" class="inline">
                    <button type="submit" class="link">Выйти</button>
                </form>
                <!-- Тема: тёмная/светлая, выбор в localStorage (тёмная по умолчанию) -->
                <button type="button" th:replace="~{fragments :: themeToggle}"></button>
            </span>
        </nav>

        <!-- page-entries: только эта страница — во всю ширину окна (fix-UI) -->
        <main class="card page-entries">
            <h1>Записи сейфа</h1>

            <div
                class="alert alert-info"
                th:if="${flashMessage}"
                th:text="${flashMessage}"
            ></div>
            <div class="alert alert-error" th:if="${flashError}" th:text="${flashError}"></div>

            <!-- Индикатор активного фильтра по тегу + сброс (Фаза 2) -->
            <div class="tag-filter" th:if="${tagFilterName != null}">
                <span>Тег: <strong th:text="${tagFilterName}">tag</strong></span>
                <a th:href="@{/web/entries}" title="Сбросить фильтр">✕</a>
            </div>

            <!-- F1: активный tagId не найден (удалён/чужой/мусор) — подсказка -->
            <div class="alert alert-info" th:if="${tagFilterUnknown}">
                Тег не найден (удалён?) — <a th:href="@{/web/entries}">показать все записи</a>
            </div>

            <a class="button" th:href="@{/web/entries/new}">+ Новая запись</a>

            <!-- CSV export/import для пользователя (Фаза 3) -->
            <div class="export-import-panel">
                <!-- GET-форма экспорта; подтверждение — data-confirm (без inline-JS) -->
                <form
                    th:action="@{/web/entries/export}"
                    method="get"
                    class="inline"
                    data-confirm="CSV будет содержать пароли в открытом виде. Продолжить?"
                >
                    <label class="checkbox">
                        <input type="checkbox" name="bom" value="true" />
                        BOM UTF-8 (для Excel)
                    </label>
                    <button type="submit" class="small">Экспорт CSV</button>
                </form>
                <a class="button" th:href="@{/web/entries/import}">Импорт CSV</a>

                <!-- G2 (Фаза 3): сканер слабых паролей — POST-форма, PRG-отчёт.
                     Расшифровка всех записей — подтверждение перед запуском. -->
                <form
                    class="inline"
                    th:action="@{/web/entries/scan}"
                    method="post"
                    data-confirm="Скан расшифрует все записи и может занять время. Запустить?"
                >
                    <button type="submit" class="small">Проверить пароли</button>
                </form>

                <!-- Явный фильтр по тегу (Фаза 6): GET-форма, кнопка —
                     единственный путь сабмита (авто-submit убран — ломал
                     клавиатурную навигацию по select). Форма передаёт
                     только tag; page сбрасывается в 0. -->
                <form
                    th:action="@{/web/entries}"
                    method="get"
                    class="tag-filter-form"
                    th:if="${!tagOptions.isEmpty()}"
                >
                    <select name="tag" aria-label="Фильтр по тегу">
                        <option value="">Все теги</option>
                        <option
                            th:each="t : ${tagOptions}"
                            th:value="${t.id}"
                            th:text="${t.name + ' (' + t.entryCount + ')'}"
                            th:selected="${tagFilterId != null && tagFilterId == t.id}"
                            >tag</option
                        >
                    </select>
                    <button type="submit" class="small">Фильтровать</button>
                </form>
            </div>

            <table th:if="${!entries.isEmpty()}">
                <thead>
                    <tr>
                        <th>Название</th>
                        <th>Сайт</th>
                        <th>Логин</th>
                        <th>Обновлена</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Пароль и примечание в списке НЕ отображаются (Task-11) -->
                    <tr th:each="entry : ${entries}">
                        <td>
                            <div class="entry-name" th:text="${entry.name}"></div>
                            <!-- Чип тега — ссылка-фильтр ?tag=<id> (Фаза 2) -->
                            <a
                                class="tag-badge"
                                th:each="tag : ${entry.tags}"
                                th:href="@{/web/entries(tag=${tag.id}, page=0)}"
                                th:text="${tag.name}"
                                >tag</a
                            >
                        </td>
                        <td th:text="${entry.site}"></td>
                        <td th:text="${entry.login}"></td>
                        <td
                            th:text="${entry.updatedAt != null ? #temporals.format(entry.updatedAt, 'yyyy-MM-dd HH:mm') : '-'}"
                        ></td>
                        <td>
                            <a th:href="@{/web/entries/{id}(id=${entry.id})}"
                                >Открыть</a
                            >
                        </td>
                    </tr>
                </tbody>
            </table>
            <p th:if="${entries.isEmpty()}">Записей пока нет.</p>

            <div class="pagination" th:if="${totalPages > 1}">
                <a
                    th:if="${currentPage > 0}"
                    th:href="@{/web/entries(page=${currentPage - 1}, tag=${tagFilterId})}"
                    >&larr;</a
                >
                <span
                    th:text="${currentPage + 1} + ' / ' + ${totalPages}"
                ></span>
                <a
                    th:if="${currentPage + 1 < totalPages}"
                    th:href="@{/web/entries(page=${currentPage + 1}, tag=${tagFilterId})}"
                    >&rarr;</a
                >
            </div>
        </main>
    </body>
</html>
