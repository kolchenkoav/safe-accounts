# Профиль docker: переопределяет только то, что отличается в контейнерах.
# Все секреты по-прежнему приходят из окружения / файлов секретов (см. .env.example).
app:
  crypto:
    master-key-base64: ${APP_CRYPTO_MASTER_KEY_BASE64:${VAULT_MASTER_KEY_BASE64:}}
    master-key-file: ${APP_CRYPTO_MASTER_KEY_FILE:${VAULT_MASTER_KEY_FILE:}}

spring:
  datasource:
    # В docker-compose сервис БД обычно называется postgres
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:safe_accounts}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
