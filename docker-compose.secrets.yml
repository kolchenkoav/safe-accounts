services:
  # Локальный dev-режим (Task-07, режим 1): секреты через .env (compose подхватывает его сам).
  # Для прод-режима (Docker secrets, файлы в /run/secrets) используйте
  # docker-compose -f docker-compose.yml -f docker-compose.secrets.yml up
  # и подготовьте файлы secrets/db_password.txt и secrets/master_key.txt.
  app:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      VAULT_MASTER_KEY_FILE: /run/secrets/master_key
    secrets:
      - db_password
      - master_key

secrets:
  db_password:
    file: ./secrets/db_password.txt
  master_key:
    file: ./secrets/master_key.txt
